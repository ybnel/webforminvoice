<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 1:1 Aspect Ratio Royal Blue Square Background with Smooth Rounded Corners -->
  <rect width="100" height="100" rx="22" fill="#0b38b8" />

  <!-- White Document Outline -->
  <path d="M 28 16 
           H 56 
           L 72 32 
           V 78 
           C 72 81.8 69.2 84.5 65.5 84.5 
           H 28.5 
           C 24.8 84.5 22 81.8 22 78 
           V 22.5 
           C 22 18.8 24.8 16 28.5 16 Z" 
        stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Folded Corner -->
  <path d="M 56 16 V 32 H 72" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Horizontal Document Lines -->
  <line x1="31" y1="38" x2="55" y2="38" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="31" y1="50" x2="55" y2="50" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="31" y1="62" x2="43" y2="62" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

  <!-- Bold White Checkmark -->
  <path d="M 47 63 L 59 75 L 81 47" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
